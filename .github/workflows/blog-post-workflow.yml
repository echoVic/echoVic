name: Latest blog posts

on:
  schedule:
    - cron: "0 1 * * *" # daily, 09:00 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://echovic.com/rss.xml"
          max_post_count: 5
          template: "- [$title]($url) · $date$newline"
          date_format: "yyyy-mm-dd"
          commit_message: "docs: update latest posts"
